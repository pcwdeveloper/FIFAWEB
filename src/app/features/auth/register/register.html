<div class="auth-page">
  <div class="card auth-card">
    <div class="brand">
      <span class="icon brand-icon">stadium</span>
      <span>FIFA Courts</span>
    </div>

    <div class="auth-card-header">
      <h2>Create your account</h2>
      <p class="subtitle">Join as a player or list your venue</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="segmented role-toggle">
        <button class="segmented-option" type="button"
                [class.active]="form.controls.role.value === 'PLAYER'"
                (click)="form.controls.role.setValue('PLAYER')">
          <span class="icon">sports_tennis</span>
          Player
        </button>
        <button class="segmented-option" type="button"
                [class.active]="form.controls.role.value === 'VENUE_OWNER'"
                (click)="form.controls.role.setValue('VENUE_OWNER')">
          <span class="icon">storefront</span>
          Venue Owner
        </button>
      </div>

      <label class="field">
        <span class="field-label">Full name</span>
        <div class="field-with-icon">
          <span class="icon field-prefix-icon">person</span>
          <input class="field-input" formControlName="fullName" autocomplete="name" />
        </div>
        @if (form.controls.fullName.hasError('required') && form.controls.fullName.touched) {
          <span class="field-error">Full name is required</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <div class="field-with-icon">
          <span class="icon field-prefix-icon">mail</span>
          <input class="field-input" type="email" formControlName="email" autocomplete="email" />
        </div>
        @if (form.controls.email.hasError('required') && form.controls.email.touched) {
          <span class="field-error">Email is required</span>
        }
        @if (form.controls.email.hasError('email') && form.controls.email.touched) {
          <span class="field-error">Enter a valid email</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Phone (optional)</span>
        <div class="field-with-icon">
          <span class="icon field-prefix-icon">call</span>
          <input class="field-input" formControlName="phone" autocomplete="tel" />
        </div>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <div class="field-with-icon">
          <span class="icon field-prefix-icon">lock</span>
          <input class="field-input" [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="new-password" />
          <button class="btn-icon field-suffix-btn" type="button" (click)="togglePasswordVisibility()"
                  [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'">
            <span class="icon">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        @if (form.controls.password.hasError('required') && form.controls.password.touched) {
          <span class="field-error">Password is required</span>
        }
        @if (form.controls.password.hasError('minlength') && form.controls.password.touched) {
          <span class="field-error">Password must be at least 8 characters</span>
        }
      </label>

      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner spinner-sm"></span>
        } @else {
          <span class="icon">person_add</span>
          Create account
        }
      </button>
    </form>

    <div class="auth-card-footer">
      <span>Already have an account? <a routerLink="/login">Sign in</a></span>
    </div>
  </div>
</div>
