<h1>Welcome, {{ authService.currentUser()?.fullName }}</h1>
<p class="subtitle">Admin dashboard</p>

@if (stats(); as s) {
  <div class="stat-row">
    <app-stat-tile icon="groups" label="Players" [value]="formatNumber(s.totalPlayers)" />
    <app-stat-tile icon="storefront" label="Venue owners" [value]="formatNumber(s.totalOwners)" />
    <app-stat-tile icon="hourglass_top" label="Pending venues" [value]="formatNumber(s.pendingVenues)" />
    <app-stat-tile icon="verified" label="Approved venues" [value]="formatNumber(s.approvedVenues)" />
    <app-stat-tile icon="sports_soccer" label="Sports" [value]="formatNumber(s.totalSports)" />
    <app-stat-tile icon="event_available" label="Confirmed bookings" [value]="formatNumber(s.confirmedBookings)" />
    <app-stat-tile icon="payments" label="Total revenue" [value]="formatCurrency(s.totalRevenue)" />
  </div>
}

<div class="admin-grid">
  <div class="card link-card hoverable-card" routerLink="/admin/venues">
    <div class="link-card-header">
      <div class="card-icon">
        <span class="icon">fact_check</span>
      </div>
      <h3>Venue approvals</h3>
    </div>
    <p>Review and approve or reject venues submitted by owners.</p>
  </div>

  <div class="card link-card hoverable-card" routerLink="/admin/sports">
    <div class="link-card-header">
      <div class="card-icon">
        <span class="icon">sports_soccer</span>
      </div>
      <h3>Sports master data</h3>
    </div>
    <p>Manage the list of sports available across the platform.</p>
  </div>
</div>
