<a routerLink="/admin" class="back-link">
  <span class="icon">arrow_back</span>
  Back to dashboard
</a>

<h1>
  <span class="icon title-icon">sports_soccer</span>
  Sports master data
</h1>

<div class="card form-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="sport-form">
    <label class="field name-field">
      <span class="field-label">Sport name</span>
      <input class="field-input" formControlName="name" placeholder="e.g. Badminton" />
      @if (form.controls.name.hasError('required') && form.controls.name.touched) {
        <span class="field-error">Sport name is required</span>
      }
    </label>
    <button class="btn btn-primary" type="submit">
      <span class="icon">{{ editingSport() ? 'save' : 'add' }}</span>
      {{ editingSport() ? 'Update' : 'Add sport' }}
    </button>
    @if (editingSport()) {
      <button class="btn btn-ghost" type="button" (click)="cancelEdit()">
        <span class="icon">close</span>
        Cancel
      </button>
    }
  </form>
</div>

@if (loading()) {
  <app-loading-indicator label="Loading sports..." />
} @else if (sports().length === 0) {
  <div class="card">
    <p>No sports added yet.</p>
  </div>
} @else {
  <div class="card item-list">
    @for (sport of sports(); track sport.id) {
      <div class="item-row">
        <span class="icon item-icon">{{ icon(sport) }}</span>
        <span class="item-title">{{ sport.name }}</span>
        <div class="item-actions">
          <button class="btn-icon" (click)="startEdit(sport)" aria-label="Edit sport">
            <span class="icon">edit</span>
          </button>
          <button class="btn-icon" (click)="deleteSport(sport)" aria-label="Delete sport">
            <span class="icon">delete</span>
          </button>
        </div>
      </div>
    }
  </div>
}
