<div class="dialog-panel">
  <div class="dialog-header">
    <span class="icon">event_repeat</span>
    <h2>Generate slots for a month</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="dialog-body">
      <div class="month-picker">
        <label class="field month-field">
          <span class="field-label">Month</span>
          <select class="field-select" formControlName="month">
            @for (name of monthNames; track name; let i = $index) {
              <option [ngValue]="i + 1">{{ name }}</option>
            }
          </select>
        </label>

        <label class="field year-field">
          <span class="field-label">Year</span>
          <select class="field-select" formControlName="year">
            @for (year of yearOptions; track year) {
              <option [ngValue]="year">{{ year }}</option>
            }
          </select>
        </label>

        <label class="field interval-field">
          <span class="field-label">Interval</span>
          <select class="field-select" formControlName="intervalMinutes">
            @for (minutes of intervalOptions; track minutes) {
              <option [ngValue]="minutes">{{ minutes }} min</option>
            }
          </select>
        </label>
      </div>

      <div class="category-list">
        @for (key of categoryKeys; track key) {
          <div class="category-row" [formGroupName]="key" [class.enabled]="isEnabled(key)">
            <span class="icon category-icon">{{ categoryIcon(key) }}</span>
            <label class="category-checkbox">
              <input type="checkbox" class="checkbox" formControlName="enabled" />
              <span class="category-name">{{ categoryLabel(key) }}</span>
            </label>

            <label class="field time-field">
              <span class="field-label">Start</span>
              <select class="field-select" formControlName="startTime">
                @for (option of startOptionsByKey()[key]; track option.value) {
                  <option [ngValue]="option.value">{{ option.label }}</option>
                }
              </select>
            </label>

            <label class="field time-field">
              <span class="field-label">End</span>
              <select class="field-select" formControlName="endTime">
                @for (option of endOptionsByKey()[key]; track option.value) {
                  <option [ngValue]="option.value">{{ option.label }}</option>
                }
              </select>
            </label>

            <label class="field price-field">
              <span class="field-label">Price</span>
              <div class="field-with-icon">
                <span class="field-prefix-icon">₹</span>
                <input class="field-input" type="number" min="0" formControlName="price" />
              </div>
            </label>
          </div>
        }
      </div>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" type="submit">Generate</button>
    </div>
  </form>
</div>
