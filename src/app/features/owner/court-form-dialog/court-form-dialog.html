<div class="dialog-panel">
  <div class="dialog-header">
    <h2>{{ isEdit ? 'Edit court' : 'Add court' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="dialog-body form-content">
      <p class="sport-label">
        <span class="icon">{{ sportIconName }}</span>
        {{ sport.name }}
      </p>

      <label class="field">
        <span class="field-label">Court name</span>
        <input class="field-input" formControlName="name" placeholder="e.g. Court 1" />
        @if (form.controls.name.hasError('required') && form.controls.name.touched) {
          <span class="field-error">Court name is required</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Price per slot</span>
        <input class="field-input" type="number" formControlName="pricePerSlot" min="0" step="0.01" />
        @if (form.controls.pricePerSlot.hasError('required') && form.controls.pricePerSlot.touched) {
          <span class="field-error">Price per slot is required</span>
        }
        @if (form.controls.pricePerSlot.hasError('min') && form.controls.pricePerSlot.touched) {
          <span class="field-error">Price cannot be negative</span>
        }
      </label>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" type="submit">{{ isEdit ? 'Save' : 'Create' }}</button>
    </div>
  </form>
</div>
