<header class="app-header">
  <span class="icon brand-icon">stadium</span>
  <span class="brand">FIFA Courts</span>
  <span class="spacer"></span>

  <button class="btn-icon" (click)="toggleTheme()" [title]="themeLabel()" [attr.aria-label]="themeLabel()">
    <span class="icon">{{ themeIcon() }}</span>
  </button>

  @if (authService.currentUser(); as user) {
    <span class="icon user-icon">account_circle</span>
    <span class="user-info">{{ user.fullName }} · {{ user.role }}</span>
    <button class="btn-icon" (click)="logout()" aria-label="Log out">
      <span class="icon">logout</span>
    </button>
  }
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
