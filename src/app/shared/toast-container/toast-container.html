<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast">
      <span class="toast-message">{{ toast.message }}</span>
      @if (toast.action) {
        <button class="toast-action" type="button" (click)="toastService.dismiss(toast.id)">{{ toast.action }}</button>
      }
    </div>
  }
</div>
